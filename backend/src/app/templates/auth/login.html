{% extends 'layout/base.html' %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="row justify-content-center mt-5">

    <div class="col-md-5 text-center">

        <h1 class="text-danger fw-bold mb-4">LOGIN</h1>

        <form id="login-form">

            <input type="text"
                   class="form-control mb-3"
                   id="username"
                   placeholder="Username or email">

            <input type="password"
                   class="form-control mb-3"
                   id="password"
                   placeholder="Password">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <button type="submit"
                        class="btn btn-primary px-5">
                    Sign in
                </button>

                <a href="#" class="small text-danger">
                    Forgot password?
                </a>

            </div>

        </form>

        <h3 class="mt-5">You haven't had account yet?</h3>

        <a href="/register/" class="btn btn-primary px-5 mt-3">
            Sign up
        </a>

        <div id="error-box"
             class="text-danger mt-3 fw-bold"></div>

    </div>

</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/auth/login.js') }}"></script>
{% endblock %}
