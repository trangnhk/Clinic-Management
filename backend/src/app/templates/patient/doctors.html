{% extends "layout/base.html" %}

{% block content %}
<div class="container mt-4">

    <h1 class="text-center text-danger mb-4">
        Our doctors are dedicated to your health
    </h2>

    <!-- Doctor list -->
    <div class="row" id="doctor-list"></div>
    <!-- Doctor Detail Modal -->
    <div class="modal fade"
        id="doctorDetailModal"
        tabindex="-1"
        aria-hidden="true">

        <div class="modal-dialog modal-lg modal-dialog-centered">

            <div class="modal-content border-0 shadow">

                <!-- HEADER -->
                <div class="modal-header bg-danger text-white">

                    <h5 class="modal-title">
                        Doctor Detail
                    </h5>

                    <button type="button"
                            class="btn-close btn-close-white"
                            data-bs-dismiss="modal">
                    </button>

                </div>

                <!-- BODY -->
                <div class="modal-body">

                    <div class="row">

                        <!-- LEFT -->
                        <div class="col-md-4 text-center">

                            <img id="modalDoctorAvatar"
                                src=""
                                class="img-fluid rounded-circle border shadow-sm mb-3"
                                style="width:180px;height:180px;object-fit:cover;">

                            <h4 id="modalDoctorName"></h4>

                            <p class="text-muted"
                            id="modalDoctorSpecialization">
                            </p>

                            <p class="fw-semibold">
                                ⭐ <span id="modalDoctorRating"></span>/5
                            </p>

                            <p class="text-muted">
                                Reviews:
                                <span id="modalDoctorReviews"></span>
                            </p>

                        </div>

                        <!-- RIGHT -->
                        <div class="col-md-8">

                            <h5 class="fw-bold mb-3">
                                Introduction
                            </h5>

                            <div class="border rounded p-3 bg-light"
                                style="min-height:200px;white-space:pre-line;"
                                id="modalDoctorIntroduce">
                            </div>

                        </div>

                    </div>

                </div>

                <!-- FOOTER -->
                <div class="modal-footer">

                    <button class="btn btn-secondary"
                            data-bs-dismiss="modal">
                        Close
                    </button>

                </div>

            </div>

        </div>

    </div>


</div>
{% endblock content %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/patient/doctors.js') }}"></script>
{% endblock scripts %}
